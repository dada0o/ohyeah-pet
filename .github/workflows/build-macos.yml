name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build app bundle
        run: |
          chmod +x PetFriends.Mac/build-macos.sh
          ./PetFriends.Mac/build-macos.sh "${{ matrix.arch }}"

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: 小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}
          path: PetFriends.Mac/dist/osx-${{ matrix.arch }}/小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
