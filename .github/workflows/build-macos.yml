name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the generated files (optional)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space for packaging
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /

          xcode_paths=()
          while IFS= read -r -d '' path; do
            xcode_paths+=("$path")
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print0)
          if (( ${#xcode_paths[@]} > 0 )); then
            sudo rm -rf -- "${xcode_paths[@]}"
          fi
          rm -rf "$HOME/Library/Caches" "$HOME/.nuget/packages"

          echo "Disk space after cleanup:"
          df -h /

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build app bundle
        env:
          PETFRIENDS_VERSION: ${{ inputs.release_tag }}
        run: |
          chmod +x PetFriends.Mac/build-macos.sh
          ./PetFriends.Mac/build-macos.sh "${{ matrix.arch }}"

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: 小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}
          path: |
            PetFriends.Mac/dist/osx-${{ matrix.arch }}/小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}.zip
            PetFriends.Mac/dist/osx-${{ matrix.arch }}/小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload versioned release files
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            RELEASE_ARCH="Apple-Silicon"
          else
            RELEASE_ARCH="Intel"
          fi
          SOURCE_BASE="PetFriends.Mac/dist/osx-${{ matrix.arch }}/小欧公爵和小耶牧师桌宠-macOS-${{ matrix.arch }}"
          RELEASE_BASE="PetFriends-${RELEASE_TAG}-macOS-${RELEASE_ARCH}"
          cp "${SOURCE_BASE}.dmg" "${RELEASE_BASE}.dmg"
          cp "${SOURCE_BASE}.zip" "${RELEASE_BASE}.zip"
          gh release upload "$RELEASE_TAG" \
            "${RELEASE_BASE}.dmg" \
            "${RELEASE_BASE}.zip" \
            --clobber
