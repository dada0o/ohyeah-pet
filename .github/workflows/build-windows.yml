name: Build Windows apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "app.manifest"
      - "build-windows.ps1"
      - "installer-windows.iss"
      - "README-Windows10-11.txt"
      - "build-win7-no-install-package.ps1"
      - "README-Win7-NoInstall.txt"
      - ".github/workflows/build-windows.yml"
  push:
    tags:
      - "v*"
      - "windows-v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows 10/11 x64 and Windows 7 (Build 26100)
    # Windows Server 2025 uses the same 10.0.26100 kernel build as
    # Windows 11 24H2, so packaging and startup are always exercised on the
    # exact build family reported by affected users.
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build folder-based Windows app and installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^windows-v', '' -replace '^v', ''
          } else {
            ([xml](Get-Content -LiteralPath PetFriends.csproj)).Project.PropertyGroup.Version
          }
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found after installation."
          }
          dotnet restore PetFriends.csproj -r win-x64
          ./build-windows.ps1 -Version $version -Architecture x64 -InnoSetupCompiler $iscc
          ./build-win7-no-install-package.ps1 -Version $version

      - name: Install and launch smoke test on Build 26100
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $osVersion = [Environment]::OSVersion.Version
          Write-Host "Runner OS version: $osVersion"
          if ($osVersion.Build -ne 26100) {
            throw "Expected the Windows 11 24H2 / Server 2025 build family 26100, got $osVersion."
          }

          $version = ([xml](Get-Content -LiteralPath PetFriends.csproj)).Project.PropertyGroup.Version
          $installer = Join-Path $PWD "dist\Windows10-11-x64\PetFriends-v$version-Windows10-11-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PetFriends-24H2-Smoke"
          $logPath = Join-Path $env:LOCALAPPDATA "PetFriends\runtime.log"
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          if (Test-Path -LiteralPath $logPath) {
            Remove-Item -LiteralPath $logPath -Force
          }

          $setup = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir",
            "/MERGETASKS=!desktopicon"
          ) -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "The installer exited with code $($setup.ExitCode)."
          }

          $app = Join-Path $installDir "小欧公爵和小耶牧师桌宠.exe"
          if (-not (Test-Path -LiteralPath $app)) {
            throw "The installed desktop pet executable was not found: $app"
          }

          $process = Start-Process -FilePath $app -PassThru
          $started = $false
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                $log = if (Test-Path -LiteralPath $logPath) { Get-Content -Raw -LiteralPath $logPath -Encoding UTF8 } else { "<no runtime log>" }
                throw "The desktop pet exited during startup with code $($process.ExitCode).`n$log"
              }
              if (Test-Path -LiteralPath $logPath) {
                $log = Get-Content -Raw -LiteralPath $logPath -Encoding UTF8
                $started = $log.Contains("Startup completed.")
              }
            } while (-not $started -and (Get-Date) -lt $deadline)

            if (-not $started) {
              throw "The desktop pet stayed alive but did not complete startup within 20 seconds."
            }
            Write-Host $log
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetFriends-Windows10-11-x64
          path: |
            dist/Windows10-11-x64/*
            publish/PetFriends-v*-Windows7-NoInstall-x86-x64.zip
          if-no-files-found: error

      - name: Upload versioned release files
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME dist/Windows10-11-x64/* publish/PetFriends-v*-Windows7-NoInstall-x86-x64.zip --clobber
