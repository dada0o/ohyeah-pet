name: Build Windows apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "app.manifest"
      - "build-windows.ps1"
      - "build-win7-no-install-package.ps1"
      - "README-Win7-NoInstall.txt"
      - ".github/workflows/build-windows.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows 10/11 x64 and Windows 7
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            ([xml](Get-Content -LiteralPath PetFriends.csproj)).Project.PropertyGroup.Version
          }
          dotnet restore PetFriends.csproj -r win-x64
          ./build-windows.ps1 -Version $version -Architecture x64
          ./build-win7-no-install-package.ps1 -Version $version

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetFriends-Windows10-11-x64
          path: |
            dist/Windows10-11-x64/*
            publish/PetFriends-v*-Windows7-NoInstall-x86-x64.zip
          if-no-files-found: error

      - name: Upload versioned release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME dist/Windows10-11-x64/* publish/PetFriends-v*-Windows7-NoInstall-x86-x64.zip --clobber
